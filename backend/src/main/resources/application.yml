server:
  port: ${PORT:8082}

spring:
  application:
    name: music-catalog-insights
  datasource:
    url: ${DB_URL:${DATABASE_URL:jdbc:h2:mem:musiccatalog;DB_CLOSE_DELAY=-1}}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-please-01234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  itunes:
    base-url: https://itunes.apple.com
    cache-ttl-minutes: 5
    max-requests-per-minute: 15
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,https://imlisten.vercel.app}
