services:
  postgres:
    image: postgres:16-alpine
    container_name: immusic-postgres
    environment:
      POSTGRES_DB: immusic
      POSTGRES_USER: immusic
      POSTGRES_PASSWORD: immusic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immusic -d immusic"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
